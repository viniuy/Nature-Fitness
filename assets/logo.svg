<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#355a32"/>
      <stop offset="1" stop-color="#1f3a1f"/>
    </linearGradient>
    <linearGradient id="oak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2b07a"/>
      <stop offset="0.5" stop-color="#c48a52"/>
      <stop offset="1" stop-color="#9c6435"/>
    </linearGradient>
    <linearGradient id="walnut" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a4622"/>
      <stop offset="0.45" stop-color="#a5672f"/>
      <stop offset="1" stop-color="#6a3b1b"/>
    </linearGradient>
    <linearGradient id="walnut2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5228"/>
      <stop offset="0.45" stop-color="#bd7c3d"/>
      <stop offset="1" stop-color="#7a4622"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.18" numOctaves="3" seed="4" result="n"/>
      <feColorMatrix in="n" values="0 0 0 0 0.24  0 0 0 0 0.12  0 0 0 0 0.04  0 0 0 2.2 -0.9" result="g"/>
      <feComposite in="g" in2="SourceGraphic" operator="in" result="gi"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="gi"/></feMerge>
    </filter>
    <filter id="vgrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.2 0.012" numOctaves="3" seed="9" result="n"/>
      <feColorMatrix in="n" values="0 0 0 0 0.2  0 0 0 0 0.09  0 0 0 0 0.03  0 0 0 2.2 -0.9" result="g"/>
      <feComposite in="g" in2="SourceGraphic" operator="in" result="gi"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="gi"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0b1a0b" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g id="mark" filter="url(#shadow)">
    <!-- handle -->
    <rect x="150" y="234" width="212" height="44" rx="14" fill="url(#oak)" filter="url(#grain)"/>
    <path d="M168 248 C210 244 250 252 300 247 S340 250 350 249" stroke="#8a5530" stroke-width="2" fill="none" opacity="0.55"/>
    <path d="M166 262 C220 266 260 259 304 264 S338 262 348 263" stroke="#8a5530" stroke-width="1.6" fill="none" opacity="0.45"/>
    <!-- inner plates -->
    <rect x="104" y="150" width="58" height="212" rx="18" fill="url(#walnut)" filter="url(#vgrain)"/>
    <rect x="350" y="150" width="58" height="212" rx="18" fill="url(#walnut)" filter="url(#vgrain)"/>
    <!-- outer plates -->
    <rect x="64" y="186" width="46" height="140" rx="15" fill="url(#walnut2)" filter="url(#vgrain)"/>
    <rect x="402" y="186" width="46" height="140" rx="15" fill="url(#walnut2)" filter="url(#vgrain)"/>
    <!-- plate edge highlights -->
    <rect x="110" y="160" width="6" height="192" rx="3" fill="#f0c48e" opacity="0.35"/>
    <rect x="356" y="160" width="6" height="192" rx="3" fill="#f0c48e" opacity="0.35"/>
    <rect x="69" y="196" width="5" height="120" rx="2.5" fill="#f0c48e" opacity="0.35"/>
    <rect x="407" y="196" width="5" height="120" rx="2.5" fill="#f0c48e" opacity="0.35"/>
    <!-- knot on a plate -->
    <ellipse cx="380" cy="300" rx="7" ry="12" fill="none" stroke="#4a2810" stroke-width="2.5" opacity="0.6"/>
    <ellipse cx="380" cy="300" rx="2.5" ry="5" fill="#4a2810" opacity="0.6"/>
    <!-- sprout -->
    <path d="M133 150 C133 128 136 112 146 98" stroke="#5c9a4a" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M146 98 C170 78 198 84 204 92 C188 112 164 114 146 98 Z" fill="#79b85f"/>
    <path d="M150 97 C166 92 182 91 198 92" stroke="#3f7a35" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M138 118 C118 100 100 104 94 112 C106 128 124 128 138 118 Z" fill="#5c9a4a"/>
  </g>
</svg>
